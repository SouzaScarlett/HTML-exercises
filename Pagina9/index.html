<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="todo-container">
        <h1>Minhas Tarefas</h1>
        
        <div class="input-area">
            <input type="text" placeholder="Nova tarefa...">
            <button class="btn-add">Adicionar</button>
        </div>

        <ul class="lista-tarefas">
            <li class="item-tarefa">
                <input type="checkbox" id="tarefa1">
                <label for="tarefa1">Estudar lógica de programação Java</label>
                <button class="btn-edit">Editar</button>
                <button class="btn-del">Excluir</button>
            </li>

            <li class="item-tarefa">
                <input type="checkbox" id="tarefa2">
                <label for="tarefa2">Praticar comandos SQL no MySQL</label>
                <button class="btn-edit">Editar</button>
                <button class="btn-del">Excluir</button>
            </li>

            <li class="item-tarefa">
                <input type="checkbox" id="tarefa3">
                <label for="tarefa3">Finalizar exercícios de HTML/CSS</label>
                <button class="btn-edit">Editar</button>
                <button class="btn-del">Excluir</button>
            </li>
        </ul>
    </main>

</body>
</html>
